name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Nem található a ChatGPTMapsWidget-GitHub-ApkBuild.zip fájl."
            exit 1
          fi

          unzip -q "$ZIP" -d project
          echo "ZIP kibontva."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi

          echo "Android projekt: $PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties
          grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Create Samsung compatible colorful widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_DIR="./app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          PACKAGE="com.example.chatgptmaps"
          PKG_PATH="com/example/chatgptmaps"
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"

          mkdir -p "$SRC_DIR"
          mkdir -p "$RES_DIR/layout"
          mkdir -p "$RES_DIR/xml"
          mkdir -p "$RES_DIR/drawable"

          cat > "$SRC_DIR/ChatGPTMapsWidgetProvider.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews

          class ChatGPTMapsWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {
                      updateWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              private fun updateWidget(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetId: Int
              ) {
                  val views = RemoteViews(
                      context.packageName,
                      R.layout.widget_chatgpt_maps_modern
                  )

                  val flags =
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

                  val mapsIntent =
                      context.packageManager.getLaunchIntentForPackage(
                          "com.google.android.apps.maps"
                      ) ?: Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0")
                      ).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }

                  val chatIntent =
                      context.packageManager.getLaunchIntentForPackage(
                          "com.openai.chatgpt"
                      ) ?: Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://chatgpt.com/")
                      ).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }

                  val ownIntent = Intent(
                      context,
                      ChatGPTMapsWidgetActivity::class.java
                  )

                  views.setOnClickPendingIntent(
                      R.id.widget_maps,
                      PendingIntent.getActivity(
                          context,
                          appWidgetId * 10 + 1,
                          mapsIntent,
                          flags
                      )
                  )

                  views.setOnClickPendingIntent(
                      R.id.widget_chatgpt,
                      PendingIntent.getActivity(
                          context,
                          appWidgetId * 10 + 2,
                          chatIntent,
                          flags
                      )
                  )

                  views.setOnClickPendingIntent(
                      R.id.widget_own,
                      PendingIntent.getActivity(
                          context,
                          appWidgetId * 10 + 3,
                          ownIntent,
                          flags
                      )
                  )

                  appWidgetManager.updateAppWidget(appWidgetId, views)
              }
          }
          EOF

          cat > "$SRC_DIR/ChatGPTMapsWidgetActivity.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle

          class ChatGPTMapsWidgetActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val intent = Intent(
                      Intent.ACTION_VIEW,
                      Uri.parse("geo:0,0")
                  )

                  startActivity(intent)
                  finish()
              }
          }
          EOF

          cat > "$RES_DIR/drawable/widget_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#061820" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/tile_maps.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00A88F"
                  android:centerColor="#00827B"
                  android:endColor="#063B46" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#00E8C2" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/tile_chatgpt.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00D7E8"
                  android:centerColor="#087DC9"
                  android:endColor="#062D66" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#00DFFF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/tile_own.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#5422D9"
                  android:centerColor="#6328D7"
                  android:endColor="#26105F" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#9B55FF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_maps.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#18B95B" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_chat.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#087BDB" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_own.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#762BE8" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/ic_chevron.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="28"
              android:viewportHeight="28">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M9,5 L18,14 L9,23 L6.5,20.5 L13,14 L6.5,7.5 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/ic_pin.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="58dp"
              android:height="58dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FF1976D2"
                  android:pathData="M32,3 C19,3 9,13 9,26 C9,43 32,61 32,61 C32,61 55,43 55,26 C55,13 45,3 32,3 Z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,15 C25,15 20,20 20,27 C20,34 25,39 32,39 C39,39 44,34 44,27 C44,20 39,15 32,15 Z" />
              <path
                  android:fillColor="#FF1769AA"
                  android:pathData="M32,20 C28,20 25,23 25,27 C25,31 28,34 32,34 C36,34 39,31 39,27 C39,23 36,20 32,20 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/ic_chatgpt.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="58dp"
              android:height="58dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,7 C24,2 13,6 11,15 C3,17 0,27 5,34 C2,43 10,51 19,50 C25,58 37,59 43,51 C52,51 59,43 57,34 C62,27 57,17 49,15 C47,7 39,2 32,7 Z M32,13 C36,10 42,12 44,17 L34,23 L24,17 C26,13 29,12 32,13 Z M19,19 L29,25 L29,36 L19,42 C15,39 14,34 17,30 L17,22 C17,21 18,20 19,19 Z M45,19 C50,21 52,26 49,30 L39,24 L39,35 L49,41 C46,45 41,47 37,44 L32,41 L32,30 Z M22,47 C18,47 15,45 13,42 L23,36 L33,42 L33,48 C29,50 25,50 22,47 Z M41,48 C38,48 35,46 34,43 L44,37 L50,41 C48,45 45,47 41,48 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/ic_compass.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="58dp"
              android:height="58dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,4 A28,28 0,1 0,32 60 A28,28 0,1 0,32 4 Z" />
              <path
                  android:fillColor="#FF33206D"
                  android:pathData="M48,16 L39,37 L16,48 L25,27 Z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M39,37 L32,32 L25,27 Z" />
              <path
                  android:fillColor="#FF3D237D"
                  android:pathData="M32,28 A4,4 0,1 0,32 36 A4,4 0,1 0,32 28 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/layout/widget_chatgpt_maps_modern.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center"
              android:padding="4dp"
              android:background="@drawable/widget_background">

              <LinearLayout
                  android:id="@+id/widget_maps"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="7dp"
                  android:background="@drawable/tile_maps">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/ic_pin"
                      android:contentDescription="Google Maps" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="34dp"
                      android:layout_height="34dp"
                      android:padding="6dp"
                      android:background="@drawable/circle_maps"
                      android:src="@drawable/ic_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/widget_chatgpt"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="7dp"
                  android:background="@drawable/tile_chatgpt">

                  <ImageView
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:src="@drawable/ic_chatgpt"
                      android:contentDescription="ChatGPT" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="34dp"
                      android:layout_height="34dp"
                      android:padding="6dp"
                      android:background="@drawable/circle_chat"
                      android:src="@drawable/ic_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/widget_own"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="7dp"
                  android:background="@drawable/tile_own">

                  <ImageView
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:src="@drawable/ic_compass"
                      android:contentDescription="Saját térkép" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="34dp"
                      android:layout_height="34dp"
                      android:padding="6dp"
                      android:background="@drawable/circle_own"
                      android:src="@drawable/ic_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat > "$RES_DIR/xml/chatgpt_maps_widget_info_modern.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="60dp"
              android:minResizeWidth="250dp"
              android:minResizeHeight="60dp"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:initialLayout="@layout/widget_chatgpt_maps_modern"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="0" />
          EOF

          # Remove any previous registration of our widget/activity and add one clean,
          # exported widget receiver. This is important for Samsung One UI launchers.
          sed -i '/ChatGPTMapsWidgetProvider/d' "$MANIFEST"
          sed -i '/ChatGPTMapsWidgetActivity/d' "$MANIFEST"

          awk -v pkg="$PACKAGE" '
            /<\/application>/ && !done {
              print "        <receiver"
              print "            android:name=\"" pkg ".ChatGPTMapsWidgetProvider\""
              print "            android:label=\"ChatGPT Maps\""
              print "            android:exported=\"true\">"
              print "            <intent-filter>"
              print "                <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />"
              print "            </intent-filter>"
              print "            <meta-data"
              print "                android:name=\"android.appwidget.provider\""
              print "                android:resource=\"@xml/chatgpt_maps_widget_info_modern\" />"
              print "        </receiver>"
              print "        <activity"
              print "            android:name=\"" pkg ".ChatGPTMapsWidgetActivity\""
              print "            android:exported=\"false\" />"
              done=1
            }
            { print }
          ' "$MANIFEST" > "$MANIFEST.tmp"

          mv "$MANIFEST.tmp" "$MANIFEST"

          echo "Samsung-kompatibilis widget létrehozva."

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")) {
                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }

                  tasks.configureEach { task ->
                      if (task.name.contains("Kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon \
            --init-script jvm17.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMapsWidget-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
