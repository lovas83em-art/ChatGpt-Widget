name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Nem található a ChatGPTMapsWidget-GitHub-ApkBuild.zip fájl."
            exit 1
          fi

          unzip -q "$ZIP" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties
          grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Create app and one simple widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_DIR="./app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          PACKAGE="com.example.chatgptmaps"
          PKG_PATH="com/example/chatgptmaps"
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"

          mkdir -p "$SRC_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          # Remove previous generated widget/activity files.
          find "$SRC_DIR" -type f -name '*Widget*.kt' -delete
          rm -f "$SRC_DIR/ChatGPTMapsWidgetActivity.kt"
          rm -f "$SRC_DIR/MainActivity.kt"

          # ------------------------------------------------------------
          # Launchable main activity.
          # ------------------------------------------------------------
          cat > "$SRC_DIR/MainActivity.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private fun openApp(packageName: String, url: String) {
                  val intent =
                      packageManager.getLaunchIntentForPackage(packageName)
                          ?: Intent(Intent.ACTION_VIEW, Uri.parse(url))
                  startActivity(intent)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(Color.rgb(8, 16, 22))
                  }

                  val title = TextView(this).apply {
                      text = "ChatGPT Maps"
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  root.addView(title)

                  val info = TextView(this).apply {
                      text = "A kezdőképernyő widgetből gyorsan megnyithatod a térképet és a ChatGPT-t."
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 30)
                  }

                  root.addView(info)

                  val maps = TextView(this).apply {
                      text = "TÉRKÉP"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(0, 150, 136))
                      setOnClickListener {
                          openApp("com.google.android.apps.maps", "geo:0,0")
                      }
                  }

                  val chat = TextView(this).apply {
                      text = "CHATGPT"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(0, 110, 190))
                      setOnClickListener {
                          openApp("com.openai.chatgpt", "https://chatgpt.com/")
                      }
                  }

                  val own = TextView(this).apply {
                      text = "SAJÁT TÉRKÉP"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(104, 55, 190))
                      setOnClickListener {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0")))
                      }
                  }

                  root.addView(maps, LinearLayout.LayoutParams(-1, 0, 1f).apply {
                      setMargins(0, 0, 0, 10)
                  })
                  root.addView(chat, LinearLayout.LayoutParams(-1, 0, 1f).apply {
                      setMargins(0, 0, 0, 10)
                  })
                  root.addView(own, LinearLayout.LayoutParams(-1, 0, 1f))

                  setContentView(root)
              }
          }
          EOF

          # ------------------------------------------------------------
          # ONE widget provider.
          # ------------------------------------------------------------
          cat > "$SRC_DIR/ChatGPTMapsWidgetProvider.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews

          class ChatGPTMapsWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (id in appWidgetIds) {
                      updateWidget(context, appWidgetManager, id)
                  }
              }

              private fun updateWidget(
                  context: Context,
                  manager: AppWidgetManager,
                  id: Int
              ) {
                  val views = RemoteViews(
                      context.packageName,
                      R.layout.widget_main
                  )

                  val flags =
                      PendingIntent.FLAG_UPDATE_CURRENT or
                      PendingIntent.FLAG_IMMUTABLE

                  val mapsIntent =
                      context.packageManager.getLaunchIntentForPackage(
                          "com.google.android.apps.maps"
                      ) ?: Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0")
                      )

                  val chatIntent =
                      context.packageManager.getLaunchIntentForPackage(
                          "com.openai.chatgpt"
                      ) ?: Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://chatgpt.com/")
                      )

                  val ownIntent = Intent(
                      Intent.ACTION_VIEW,
                      Uri.parse("geo:0,0")
                  )

                  views.setOnClickPendingIntent(
                      R.id.maps_button,
                      PendingIntent.getActivity(context, id * 10 + 1, mapsIntent, flags)
                  )

                  views.setOnClickPendingIntent(
                      R.id.chatgpt_button,
                      PendingIntent.getActivity(context, id * 10 + 2, chatIntent, flags)
                  )

                  views.setOnClickPendingIntent(
                      R.id.own_button,
                      PendingIntent.getActivity(context, id * 10 + 3, ownIntent, flags)
                  )

                  manager.updateAppWidget(id, views)
              }
          }
          EOF

          # ------------------------------------------------------------
          # Simple vector icons.
          # ------------------------------------------------------------
          cat > "$RES_DIR/drawable/icon_maps.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp"
              android:height="64dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,4 C21,4 12,13 12,24 C12,38 32,58 32,58 C32,58 52,38 52,24 C52,13 43,4 32,4 Z" />
              <path
                  android:fillColor="#FF19A86B"
                  android:pathData="M32,16 A8,8 0,1 0,32 32 A8,8 0,1 0,32 16 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/icon_chatgpt.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp"
              android:height="64dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,7 C24,3 15,7 13,15 C5,17 2,26 7,33 C4,41 11,50 20,49 C26,57 38,58 45,50 C54,50 60,41 57,33 C62,26 58,17 50,15 C48,7 39,3 32,7 Z M32,14 C36,12 41,14 43,18 L34,24 L24,18 C26,15 29,13 32,14 Z M18,20 L28,26 L28,38 L18,44 C14,40 14,35 17,31 L16,23 C16,21 17,20 18,20 Z M45,20 C49,22 50,27 47,31 L38,25 L38,38 L48,44 C44,48 39,48 35,45 L32,43 L32,31 Z M21,49 C18,48 16,46 15,43 L25,38 L35,44 L35,50 C30,52 25,52 21,49 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/icon_compass.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp"
              android:height="64dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,5 A27,27 0,1 0,32 59 A27,27 0,1 0,32 5 Z" />
              <path
                  android:fillColor="#FF6B2BE8"
                  android:pathData="M49,15 L40,38 L15,49 L24,26 Z" />
              <path
                  android:fillColor="#FF6B2BE8"
                  android:pathData="M32,27 A5,5 0,1 0,32 37 A5,5 0,1 0,32 27 Z" />
          </vector>
          EOF

          # ------------------------------------------------------------
          # Simple solid backgrounds: maximum RemoteViews compatibility.
          # ------------------------------------------------------------
          cat > "$RES_DIR/drawable/widget_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#07151B" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/card_green.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#00A98F" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/card_blue.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#087FD1" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/card_purple.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#7130D9" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          # ------------------------------------------------------------
          # Widget: ONE short horizontal widget, icons only.
          # ------------------------------------------------------------
          cat > "$RES_DIR/layout/widget_main.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center"
              android:padding="4dp"
              android:background="@drawable/widget_background">

              <ImageButton
                  android:id="@+id/maps_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:padding="12dp"
                  android:scaleType="centerInside"
                  android:src="@drawable/icon_maps"
                  android:background="@drawable/card_green"
                  android:contentDescription="Térkép" />

              <ImageButton
                  android:id="@+id/chatgpt_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:padding="12dp"
                  android:scaleType="centerInside"
                  android:src="@drawable/icon_chatgpt"
                  android:background="@drawable/card_blue"
                  android:contentDescription="ChatGPT" />

              <ImageButton
                  android:id="@+id/own_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:padding="12dp"
                  android:scaleType="centerInside"
                  android:src="@drawable/icon_compass"
                  android:background="@drawable/card_purple"
                  android:contentDescription="Saját térkép" />

          </LinearLayout>
          EOF

          # ------------------------------------------------------------
          # Exactly ONE AppWidgetProvider entry.
          # ------------------------------------------------------------
          cat > "$RES_DIR/xml/widget_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="60dp"
              android:minResizeWidth="250dp"
              android:minResizeHeight="60dp"
              android:initialLayout="@layout/widget_main"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="0" />
          EOF

          # Clean manifest: one launcher + one widget provider.
          cat > "$MANIFEST" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="ChatGPT Maps"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name="com.example.chatgptmaps.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name="com.example.chatgptmaps.ChatGPTMapsWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>

                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>

              </application>

          </manifest>
          EOF

          echo "Elkészült: 1 launcher Activity + pontosan 1 egyszerű widget."

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")) {
                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }

                  tasks.configureEach { task ->
                      if (task.name.contains("Kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon \
            --init-script jvm17.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMapsWidget-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
