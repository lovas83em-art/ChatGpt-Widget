name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Nem található a ChatGPTMapsWidget-GitHub-ApkBuild.zip fájl."
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties
          grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Create exactly one home-screen widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_DIR="./app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          PACKAGE="com.example.chatgptmaps"
          PKG_PATH="com/example/chatgptmaps"
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"

          mkdir -p "$SRC_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          # One provider only. The widget has three clickable areas.
          cat > "$SRC_DIR/ChatGPTMapsWidgetProvider.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews

          class ChatGPTMapsWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  manager: AppWidgetManager,
                  ids: IntArray
              ) {
                  for (id in ids) {
                      val views = RemoteViews(
                          context.packageName,
                          R.layout.widget_one
                      )

                      val flags =
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE

                      val maps =
                          context.packageManager.getLaunchIntentForPackage(
                              "com.google.android.apps.maps"
                          ) ?: Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("geo:0,0")
                          )

                      val chat =
                          context.packageManager.getLaunchIntentForPackage(
                              "com.openai.chatgpt"
                          ) ?: Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://chatgpt.com/")
                          )

                      val own =
                          Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("geo:0,0")
                          )

                      views.setOnClickPendingIntent(
                          R.id.button_maps,
                          PendingIntent.getActivity(
                              context,
                              id * 10 + 1,
                              maps,
                              flags
                          )
                      )

                      views.setOnClickPendingIntent(
                          R.id.button_chatgpt,
                          PendingIntent.getActivity(
                              context,
                              id * 10 + 2,
                              chat,
                              flags
                          )
                      )

                      views.setOnClickPendingIntent(
                          R.id.button_own,
                          PendingIntent.getActivity(
                              context,
                              id * 10 + 3,
                              own,
                              flags
                          )
                      )

                      manager.updateAppWidget(id, views)
                  }
              }
          }
          EOF

          # Remove the old custom Activity; the one widget needs no extra Activity.
          rm -f "$SRC_DIR/ChatGPTMapsWidgetActivity.kt"

          cat > "$RES_DIR/drawable/one_widget_bg.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#071820" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_tile_green.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00B894"
                  android:centerColor="#008F83"
                  android:endColor="#07515A" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#00E8C2" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_tile_blue.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00D8E8"
                  android:centerColor="#087DCA"
                  android:endColor="#07346B" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#00E5FF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_tile_purple.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#5D25E8"
                  android:centerColor="#682BDD"
                  android:endColor="#28115F" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#A55BFF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_circle_green.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#19B85B" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_circle_blue.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#087BDB" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_circle_purple.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#762BE8" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/one_chevron.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="28"
              android:viewportHeight="28">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M9,5 L18,14 L9,23 L6.5,20.5 L13,14 L6.5,7.5 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/one_pin.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="54dp"
              android:height="54dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FF1976D2"
                  android:pathData="M32,3 C19,3 9,13 9,26 C9,43 32,61 32,61 C32,61 55,43 55,26 C55,13 45,3 32,3 Z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,15 C25,15 20,20 20,27 C20,34 25,39 32,39 C39,39 44,34 44,27 C44,20 39,15 32,15 Z" />
              <path
                  android:fillColor="#FF1769AA"
                  android:pathData="M32,20 C28,20 25,23 25,27 C25,31 28,34 32,34 C36,34 39,31 39,27 C39,23 36,20 32,20 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/one_chatgpt.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="54dp"
              android:height="54dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,7 C24,2 13,6 11,15 C3,17 0,27 5,34 C2,43 10,51 19,50 C25,58 37,59 43,51 C52,51 59,43 57,34 C62,27 57,17 49,15 C47,7 39,2 32,7 Z M32,13 C36,10 42,12 44,17 L34,23 L24,17 C26,13 29,12 32,13 Z M19,19 L29,25 L29,36 L19,42 C15,39 14,34 17,30 L17,22 C17,21 18,20 19,19 Z M45,19 C50,21 52,26 49,30 L39,24 L39,35 L49,41 C46,45 41,47 37,44 L32,41 L32,30 Z M22,47 C18,47 15,45 13,42 L23,36 L33,42 L33,48 C29,50 25,50 22,47 Z M41,48 C38,48 35,46 34,43 L44,37 L50,41 C48,45 45,47 41,48 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/one_compass.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="54dp"
              android:height="54dp"
              android:viewportWidth="64"
              android:viewportHeight="64">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M32,4 A28,28 0,1 0,32 60 A28,28 0,1 0,32 4 Z" />
              <path
                  android:fillColor="#FF33206D"
                  android:pathData="M48,16 L39,37 L16,48 L25,27 Z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M39,37 L32,32 L25,27 Z" />
              <path
                  android:fillColor="#FF3D237D"
                  android:pathData="M32,28 A4,4 0,1 0,32 36 A4,4 0,1 0,32 28 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/layout/widget_one.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:gravity="center"
              android:padding="4dp"
              android:background="@drawable/one_widget_bg">

              <LinearLayout
                  android:id="@+id/button_maps"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="7dp"
                  android:paddingEnd="6dp"
                  android:background="@drawable/one_tile_green">

                  <ImageView
                      android:layout_width="44dp"
                      android:layout_height="44dp"
                      android:src="@drawable/one_pin"
                      android:contentDescription="Térkép" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:padding="6dp"
                      android:background="@drawable/one_circle_green"
                      android:src="@drawable/one_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/button_chatgpt"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="7dp"
                  android:paddingEnd="6dp"
                  android:background="@drawable/one_tile_blue">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/one_chatgpt"
                      android:contentDescription="ChatGPT" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:padding="6dp"
                      android:background="@drawable/one_circle_blue"
                      android:src="@drawable/one_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/button_own"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="7dp"
                  android:paddingEnd="6dp"
                  android:background="@drawable/one_tile_purple">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/one_compass"
                      android:contentDescription="Saját térkép" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:padding="6dp"
                      android:background="@drawable/one_circle_purple"
                      android:src="@drawable/one_chevron"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat > "$RES_DIR/xml/widget_one_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="60dp"
              android:minResizeWidth="250dp"
              android:minResizeHeight="60dp"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:initialLayout="@layout/widget_one"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="0" />
          EOF

          # Clean all old appwidget receivers from the manifest.
          awk '
            BEGIN { in_receiver=0; receiver_has_widget=0; block="" }
            /<receiver([[:space:]]|>)/ {
              in_receiver=1
              receiver_has_widget=0
              block=$0 "\n"
              next
            }
            in_receiver {
              block=block $0 "\n"
              if ($0 ~ /appwidget.action.APPWIDGET_UPDATE/) receiver_has_widget=1
              if ($0 ~ /<\/receiver>/) {
                if (!receiver_has_widget) printf "%s", block
                in_receiver=0
                block=""
              }
              next
            }
            { print }
          ' "$MANIFEST" > "$MANIFEST.tmp"

          mv "$MANIFEST.tmp" "$MANIFEST"

          # Remove the old widget Activity registration if it exists.
          sed -i '/ChatGPTMapsWidgetActivity/d' "$MANIFEST"

          # Add exactly one widget receiver.
          awk -v pkg="$PACKAGE" '
            /<\/application>/ && !done {
              print "        <receiver"
              print "            android:name=\"" pkg ".ChatGPTMapsWidgetProvider\""
              print "            android:label=\"ChatGPT Maps\""
              print "            android:exported=\"true\">"
              print "            <intent-filter>"
              print "                <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />"
              print "            </intent-filter>"
              print "            <meta-data"
              print "                android:name=\"android.appwidget.provider\""
              print "                android:resource=\"@xml/widget_one_info\" />"
              print "        </receiver>"
              done=1
            }
            { print }
          ' "$MANIFEST" > "$MANIFEST.tmp"

          mv "$MANIFEST.tmp" "$MANIFEST"

          echo "Pontosan egy widget-provider maradt."

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")) {
                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }

                  tasks.configureEach { task ->
                      if (task.name.contains("Kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon \
            --init-script jvm17.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMapsWidget-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
