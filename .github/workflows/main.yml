name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f \
            -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Nem található a ChatGPTMapsWidget-GitHub-ApkBuild.zip fájl."
            exit 1
          fi

          unzip -q "$ZIP" -d project

          echo "ZIP kibontva."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find project -type f \
            -name settings.gradle -o -name settings.gradle.kts \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi

          echo "Android projekt: $PROJECT"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Add 3rd button home-screen widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Widget létrehozása..."

          APP_DIR=$(find . -type f \
            -path '*/src/main/AndroidManifest.xml' \
            -print -quit | sed 's#/
