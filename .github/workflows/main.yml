name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Nem található a ZIP fájl."
            exit 1
          fi

          unzip -q "$ZIP" -d project

          echo "ZIP kibontva."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find project -type f -name 'settings.gradle' -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find project -type f -name 'settings.gradle.kts' -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi

          echo "Android projekt: $PROJECT"

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Add 3rd button home-screen widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Widget létrehozása..."

          MANIFEST="./app/src/main/AndroidManifest.xml"
          APP_DIR="./app"
          PACKAGE="com.example.chatgptmaps"

          if [ ! -f "$MANIFEST" ]; then
            echo "Nem található: $MANIFEST"
            exit 1
          fi

          echo "Manifest: $MANIFEST"
          echo "App könyvtár: $APP_DIR"
          echo "Android package: $PACKAGE"

          SRC_DIR="$APP_DIR/src/main/java/com/example/chatgptmaps"

          mkdir -p "$SRC_DIR"
          mkdir -p "$APP_DIR/src/main/res/layout"
          mkdir -p "$APP_DIR/src/main/res/xml"

          cat > "$SRC_DIR/ChatGPTMapsWidgetProvider.java" <<'EOF'
          package com.example.chatgptmaps;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          public class ChatGPTMapsWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(
                      Context context,
                      AppWidgetManager manager,
                      int[] appWidgetIds) {

                  for (int appWidgetId : appWidgetIds) {

                      RemoteViews views = new RemoteViews(
                              context.getPackageName(),
                              R.layout.chatgpt_maps_widget
                      );

                      Intent intent = new Intent(
                              context,
                              ChatGPTMapsWidgetActivity.class
                      );

                      PendingIntent pendingIntent =
                              PendingIntent.getActivity(
                                      context,
                                      appWidgetId,
                                      intent,
                                      PendingIntent.FLAG_UPDATE_CURRENT
                                      | PendingIntent.FLAG_IMMUTABLE
                              );

                      views.setOnClickPendingIntent(
                              R.id.widget_open,
                              pendingIntent
                      );

                      manager.updateAppWidget(
                              appWidgetId,
                              views
                      );
                  }
              }
          }
          EOF

          cat > "$SRC_DIR/ChatGPTMapsWidgetActivity.java" <<'EOF'
          package com.example.chatgptmaps;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class ChatGPTMapsWidgetActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(40, 40, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("SAJÁT TÉRKÉP / AI");
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText(
                      "A kezdőképernyő widgetből megnyitott " +
                      "Saját térkép / AI felület."
                  );
                  info.setTextSize(17);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 25, 0, 35);

                  Button maps = new Button(this);
                  maps.setText("GOOGLE MAPS MEGNYITÁSA");

                  maps.setOnClickListener(v -> {
                      Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("geo:0,0")
                      );
                      startActivity(intent);
                  });

                  Button chatgpt = new Button(this);
                  chatgpt.setText("CHATGPT MEGNYITÁSA");

                  chatgpt.setOnClickListener(v -> {
                      Intent intent =
                              getPackageManager()
                                      .getLaunchIntentForPackage(
                                              "com.openai.chatgpt"
                                      );

                      if (intent != null) {
                          startActivity(intent);
                      } else {
                          startActivity(
                                  new Intent(
                                          Intent.ACTION_VIEW,
                                          Uri.parse("https://chatgpt.com/")
                                  )
                          );
                      }
                  });

                  root.addView(title);
                  root.addView(info);
                  root.addView(maps);
                  root.addView(chatgpt);

                  setContentView(root);
              }
          }
          EOF

          cat > "$APP_DIR/src/main/res/layout/chatgpt_maps_widget.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="12dp"
              android:background="#E8E8E8">

              <TextView
                  android:id="@+id/widget_open"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:text="SAJÁT TÉRKÉP / AI&#10;&#10;Koppints a megnyitáshoz"
                  android:textStyle="bold"
                  android:textSize="16sp"
                  android:textColor="#333333"
                  android:clickable="true" />

          </LinearLayout>
          EOF

          cat > "$APP_DIR/src/main/res/xml/chatgpt_maps_widget_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="72dp"
              android:updatePeriodMillis="86400000"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:initialLayout="@layout/chatgpt_maps_widget" />
          EOF

          if ! grep -q "ChatGPTMapsWidgetProvider" "$MANIFEST"; then

            sed -i '/<\/application>/i\
              <receiver\
                  android:name="com.example.chatgptmaps.ChatGPTMapsWidgetProvider"\
                  android:exported="false">\
                  <intent-filter>\
                      <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\
                  </intent-filter>\
                  <meta-data\
                      android:name="android.appwidget.provider"\
                      android:resource="@xml/chatgpt_maps_widget_info" />\
              </receiver>\
              <activity\
                  android:name="com.example.chatgptmaps.ChatGPTMapsWidgetActivity"\
                  android:exported="false" />' "$MANIFEST"

          fi

          echo "Widget létrehozva."

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")) {

                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }

                  tasks.configureEach { task ->
                      if (task.name.contains("Kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon \
            --init-script jvm17.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMapsWidget-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
