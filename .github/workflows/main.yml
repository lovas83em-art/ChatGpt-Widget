name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name 'ChatGPTMapsWidget-GitHub-ApkBuild.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "Nem található a ChatGPTMapsWidget-GitHub-ApkBuild.zip fájl."
            exit 1
          fi

          unzip -q "$ZIP" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Nem található Android Gradle projekt."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties
          grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Build a clean Samsung One UI widget
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_DIR="./app"
          MANIFEST="$APP_DIR/src/main/AndroidManifest.xml"
          PACKAGE="com.example.chatgptmaps"
          PKG_PATH="com/example/chatgptmaps"
          SRC_DIR="$APP_DIR/src/main/java/$PKG_PATH"
          RES_DIR="$APP_DIR/src/main/res"

          mkdir -p "$SRC_DIR"
          mkdir -p "$RES_DIR/layout"
          mkdir -p "$RES_DIR/xml"
          mkdir -p "$RES_DIR/drawable"

          # ------------------------------------------------------------
          # 1. One provider only, no extra widget activity.
          # ------------------------------------------------------------
          cat > "$SRC_DIR/ChatGPTMapsWidgetProvider.kt" <<'EOF'
          package com.example.chatgptmaps

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews

          class ChatGPTMapsWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {

                      val views = RemoteViews(
                          context.packageName,
                          R.layout.widget_main
                      )

                      val flags =
                          PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE

                      val mapsIntent =
                          context.packageManager.getLaunchIntentForPackage(
                              "com.google.android.apps.maps"
                          ) ?: Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("geo:0,0")
                          )

                      val chatIntent =
                          context.packageManager.getLaunchIntentForPackage(
                              "com.openai.chatgpt"
                          ) ?: Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://chatgpt.com/")
                          )

                      val ownMapIntent = Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("geo:0,0")
                      )

                      views.setOnClickPendingIntent(
                          R.id.maps_button,
                          PendingIntent.getActivity(
                              context,
                              appWidgetId * 3 + 1,
                              mapsIntent,
                              flags
                          )
                      )

                      views.setOnClickPendingIntent(
                          R.id.chatgpt_button,
                          PendingIntent.getActivity(
                              context,
                              appWidgetId * 3 + 2,
                              chatIntent,
                              flags
                          )
                      )

                      views.setOnClickPendingIntent(
                          R.id.own_button,
                          PendingIntent.getActivity(
                              context,
                              appWidgetId * 3 + 3,
                              ownMapIntent,
                              flags
                          )
                      )

                      appWidgetManager.updateAppWidget(
                          appWidgetId,
                          views
                      )
                  }
              }
          }
          EOF

          # Remove old widget/activity source files that could create
          # additional providers or conflicting components.
          find "$SRC_DIR" -type f -name '*Widget*.kt' ! -name 'ChatGPTMapsWidgetProvider.kt' -delete
          rm -f "$SRC_DIR/ChatGPTMapsWidgetActivity.kt"

          # ------------------------------------------------------------
          # 2. Simple, Samsung-safe vector icons.
          # ------------------------------------------------------------
          cat > "$RES_DIR/drawable/icon_maps.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="52dp"
              android:height="52dp"
              android:viewportWidth="52"
              android:viewportHeight="52">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M26,3 C17,3 10,10 10,19 C10,30 26,48 26,48 C26,48 42,30 42,19 C42,10 35,3 26,3 Z" />
              <path
                  android:fillColor="#FF1984D5"
                  android:pathData="M26,13 A7,7 0,1 0,26 27 A7,7 0,1 0,26 13 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/icon_chatgpt.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="52dp"
              android:height="52dp"
              android:viewportWidth="52"
              android:viewportHeight="52">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M26,5 C19,2 11,6 10,13 C3,15 1,23 5,29 C3,36 9,43 16,42 C21,49 31,50 36,43 C44,43 49,36 47,29 C51,23 47,15 41,13 C40,6 32,2 26,5 Z M26,11 C30,9 34,11 36,15 L28,20 L20,15 C21,12 24,10 26,11 Z M16,17 L24,22 L24,31 L16,36 C12,33 12,29 14,26 L14,19 C14,18 15,17 16,17 Z M36,17 C40,19 41,23 39,26 L31,21 L31,31 L39,36 C36,39 32,40 29,37 L26,35 L26,25 Z M18,39 C15,39 12,37 11,34 L19,30 L27,35 L27,40 C24,41 21,41 18,39 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/icon_compass.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="52dp"
              android:height="52dp"
              android:viewportWidth="52"
              android:viewportHeight="52">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M26,3 A23,23 0,1 0,26 49 A23,23 0,1 0,26 3 Z" />
              <path
                  android:fillColor="#FF3B237C"
                  android:pathData="M40,12 L34,30 L13,40 L19,22 Z" />
              <path
                  android:fillColor="#FF3B237C"
                  android:pathData="M26,22 A4,4 0,1 0,26 30 A4,4 0,1 0,26 22 Z" />
          </vector>
          EOF

          cat > "$RES_DIR/drawable/icon_arrow.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M8,4 L18,12 L8,20 L5,17 L11.5,12 L5,7 Z" />
          </vector>
          EOF

          # ------------------------------------------------------------
          # 3. Colorful tiles. NO visible text.
          # ------------------------------------------------------------
          cat > "$RES_DIR/drawable/bg_widget.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#07151B" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/bg_green.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00BFA5"
                  android:centerColor="#008E86"
                  android:endColor="#07515B" />
              <corners android:radius="20dp" />
              <stroke
                  android:width="1dp"
                  android:color="#00E6C6" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/bg_blue.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#00D8EA"
                  android:centerColor="#087DCC"
                  android:endColor="#06356C" />
              <corners android:radius="20dp" />
              <stroke
                  android:width="1dp"
                  android:color="#00E5FF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/bg_purple.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:type="linear"
                  android:angle="0"
                  android:startColor="#6A28F0"
                  android:centerColor="#662BD8"
                  android:endColor="#28115F" />
              <corners android:radius="20dp" />
              <stroke
                  android:width="1dp"
                  android:color="#A75CFF" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_green.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#19B85B" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_blue.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#087BDB" />
          </shape>
          EOF

          cat > "$RES_DIR/drawable/circle_purple.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#762BE8" />
          </shape>
          EOF

          # ------------------------------------------------------------
          # 4. Very simple RemoteViews layout.
          # ------------------------------------------------------------
          cat > "$RES_DIR/layout/widget_main.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:padding="4dp"
              android:gravity="center"
              android:background="@drawable/bg_widget">

              <LinearLayout
                  android:id="@+id/maps_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="5dp"
                  android:background="@drawable/bg_green">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/icon_maps"
                      android:contentDescription="Térkép" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:padding="6dp"
                      android:src="@drawable/icon_arrow"
                      android:background="@drawable/circle_green"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/chatgpt_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="5dp"
                  android:background="@drawable/bg_blue">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/icon_chatgpt"
                      android:contentDescription="ChatGPT" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:padding="6dp"
                      android:src="@drawable/icon_arrow"
                      android:background="@drawable/circle_blue"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/own_button"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_margin="2dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="5dp"
                  android:background="@drawable/bg_purple">

                  <ImageView
                      android:layout_width="46dp"
                      android:layout_height="46dp"
                      android:src="@drawable/icon_compass"
                      android:contentDescription="Saját térkép" />

                  <View
                      android:layout_width="0dp"
                      android:layout_height="1dp"
                      android:layout_weight="1" />

                  <ImageView
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:padding="6dp"
                      android:src="@drawable/icon_arrow"
                      android:background="@drawable/circle_purple"
                      android:contentDescription="Megnyitás" />
              </LinearLayout>

          </LinearLayout>
          EOF

          # ------------------------------------------------------------
          # 5. One and ONLY one AppWidgetProvider declaration.
          # ------------------------------------------------------------
          cat > "$RES_DIR/xml/widget_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="60dp"
              android:minResizeWidth="250dp"
              android:minResizeHeight="60dp"
              android:initialLayout="@layout/widget_main"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="0" />
          EOF

          # Remove every old AppWidgetProvider receiver and write a clean manifest.
          cat > "$MANIFEST" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="ChatGPT Maps"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <receiver
                      android:name="com.example.chatgptmaps.ChatGPTMapsWidgetProvider"
                      android:label="ChatGPT Maps"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>

                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>

              </application>

          </manifest>
          EOF

          echo "Kész: pontosan 1 widget provider, 0 extra widget/activity."

      - name: Configure JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          cat > jvm17.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") ||
                      plugins.hasPlugin("com.android.library")) {
                      android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }

                  tasks.configureEach { task ->
                      if (task.name.contains("Kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon \
            --init-script jvm17.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMapsWidget-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
